name: prior_v1
exp: V1
proc: datasets/EVD4UAV_processed
raw:  datasets/EVD4UAV/raw/EVD4UAV
out_dir: runs/priornet
model:
  arch: v1
  base: 32
loss:
  main: focal
  lambda_dice: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
epochs: 30
batch_size: 8
lr: 1.0e-4
weight_decay: 1.0e-4
amp: true
augment: true
seed: 42
log_interval: 20
